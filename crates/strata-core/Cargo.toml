[package]
name = "strata-core"
version.workspace = true
edition.workspace = true
description = "GTK-free core of the Strata file manager"
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["rar"]
rar = ["dep:unrar", "dep:unrar_sys"]
test-support = []

[dependencies]
cairo-rs = { workspace = true }
calamine = { workspace = true }
csv = { workspace = true }
docx-rs = { workspace = true }
flate2 = { workspace = true }
futures-channel = { workspace = true }
futures-lite = { workspace = true }
gdk-pixbuf = { workspace = true }
gio = { workspace = true }
gio-unix = { workspace = true }
glib = { workspace = true }
gstreamer = { workspace = true }
html5gum = { workspace = true }
ignore = { workspace = true }
image = { workspace = true }
kamadak-exif = { workspace = true }
landlock = { workspace = true }
libc = { workspace = true }
mermaid-svg = { workspace = true }
rquickjs = { workspace = true }
quick-xml = { workspace = true }
pangocairo = { workspace = true }
poppler = { workspace = true }
pulldown-cmark = { workspace = true }
ring = { workspace = true }
resvg = { workspace = true }
rust-i18n = { workspace = true }
rustix = { workspace = true }
seccompiler = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sevenz-rust2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = { workspace = true }
zip = { workspace = true }
unrar = { workspace = true, optional = true }
unrar_sys = { workspace = true, optional = true }
frizbee = { workspace = true }

[build-dependencies]
glib-build-tools = { workspace = true }
rust-i18n-support = { workspace = true }

[lints]
workspace = true
